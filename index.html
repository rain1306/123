<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ruang belajar Bahasa Arab untuk siswa MTs kelas VII, VIII, dan IX.">
  <title>Arabiyah • Ruang Belajar MTs</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="lessons.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./"><img src="favicon.png" alt="" width="44" height="44"><span>Arabiyah<small>RUANG BELAJAR MTS</small></span></a>
      <nav aria-label="Navigasi utama">
        <button type="button" data-page="learn">Belajar</button>
        <button type="button" data-page="progress">Progres saya</button>
        <button type="button" data-page="teacher">Ruang guru</button>
        <button type="button" id="account">Masuk</button>
      </nav>
    </div>
  </header>
  <main>
    <div id="notice" role="status"></div>
    <section id="view" aria-label="Konten utama"></section>
  </main>
  <footer><div class="footer-inner"><strong>Arabiyah MTs</strong><span>Bahasa Arab · Kelas VII, VIII, dan IX</span></div></footer>
  <dialog id="auth" aria-labelledby="auth-title">
    <form id="authform">
      <h2 id="auth-title">Selamat datang</h2>
      <p id="auth-note">Masuk untuk menyimpan progres lintas perangkat.</p>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Kata sandi<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <div class="row">
        <button name="action" value="login">Masuk</button>
        <button name="action" value="signup" class="secondary">Daftar sebagai siswa</button>
        <button type="button" id="closeauth" class="secondary">Tutup</button>
      </div>
    </form>
  </dialog>
</body>
</html>
